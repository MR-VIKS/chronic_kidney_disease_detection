<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Health Platform{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --bg-gradient-start: #0F172A;
            --bg-gradient-end: #1E1B4B;
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --input-bg: rgba(15, 23, 42, 0.6);
            --input-border: rgba(255, 255, 255, 0.15);
            --danger: #EF4444;
            --danger-bg: rgba(239, 68, 68, 0.1);
            --success: #10B981;
            --success-bg: rgba(16, 185, 129, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-x: hidden;
        }

        /* Abstract background shapes */
        .bg-shape {
            position: fixed;
            filter: blur(100px);
            z-index: 0;
            opacity: 0.5;
            border-radius: 50%;
        }
        .shape-1 {
            width: 400px;
            height: 400px;
            background: #818CF8;
            top: -100px;
            left: -100px;
            animation: float 10s infinite ease-in-out alternate;
        }
        .shape-2 {
            width: 500px;
            height: 500px;
            background: #C084FC;
            bottom: -200px;
            right: -100px;
            animation: float 12s infinite ease-in-out alternate-reverse;
        }

        @keyframes float {
            0% { transform: translate(0, 0); }
            100% { transform: translate(30px, 50px); }
        }

        nav {
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 20;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--card-border);
            background: rgba(15, 23, 42, 0.5);
        }

        .nav-logo {
            font-weight: 700;
            font-size: 1.5rem;
            color: var(--text-main);
            text-decoration: none;
            background: linear-gradient(to right, #818CF8, #C084FC);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            margin-left: 2rem;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: #818CF8;
        }

        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            width: 100%;
            padding: 2rem;
        }

        footer {
            margin-top: auto;
            padding: 2rem;
            z-index: 10;
            color: var(--text-muted);
            font-size: 0.9rem;
            text-align: center;
        }

        {% block extra_css %}{% endblock %}

    </style>
</head>
<body>
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>

    <nav>
        <a href="{{ url_for('main.index') }}" class="nav-logo">KidneyProtect</a>
        <div class="nav-links">
            <a href="{{ url_for('main.index') }}">Platform Details</a>
            <a href="{{ url_for('main.check') }}">Start Assessment</a>
        </div>
    </nav>

    <div class="main-content">
        {% block content %}{% endblock %}
    </div>

    <footer>
        <p>&copy; 2025 Ashutosh Shukla | AI Health Diagnostics</p>
    </footer>

</body>
</html>
