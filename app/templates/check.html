{% extends "base.html" %}

{% block title %}CKD Assessment Form{% endblock %}

{% block extra_css %}
<style>
    .header {
        text-align: center;
        padding: 1rem 1rem;
    }

    .header h1 {
        font-size: 2.5rem;
        font-weight: 700;
        margin-bottom: 0.5rem;
        background: linear-gradient(to right, #818CF8, #C084FC);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    .header p {
        color: var(--text-muted);
        font-size: 1.1rem;
    }

    .dashboard-container {
        width: 100%;
        max-width: 900px;
        background: var(--card-bg);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid var(--card-border);
        border-radius: 24px;
        padding: 3rem;
        margin: 1rem 1rem;
        box-shadow: var(--shadow-main);
        transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .dashboard-container:hover {
        transform: translateY(-2px);
    }

    form {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 1.5rem 2rem;
    }

    .form-group {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
    }

    label {
        font-weight: 500;
        font-size: 0.95rem;
        color: var(--text-heading);
        display: flex;
        align-items: center;
        gap: 0.5rem;
        transition: color 0.3s ease;
    }

    .form-group:hover label {
        color: #818CF8;
    }

    input, select {
        width: 100%;
        padding: 0.85rem 1rem;
        background: var(--input-bg);
        border: 1px solid var(--input-border);
        border-radius: 12px;
        color: var(--text-main);
        font-family: inherit;
        font-size: 1rem;
        outline: none;
        transition: all 0.3s ease;
        appearance: none;
    }

    select {
        background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2394A3B8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
        background-repeat: no-repeat;
        background-position: right 1rem center;
        background-size: 1em;
    }
    
    select option {
        background: var(--bg-gradient-end);
        color: var(--text-main);
    }

    input:focus, select:focus {
        border-color: #818CF8;
        box-shadow: 0 0 0 4px rgba(129, 140, 248, 0.15);
        background: var(--input-bg-focus);
    }

    input::placeholder {
        color: rgba(148, 163, 184, 0.5);
    }

    .helper-text {
        font-size: 0.825rem;
        color: rgba(148, 163, 184, 0.7);
        margin-top: -0.15rem;
        padding-left: 0.25rem;
    }

    .submit-btn {
        grid-column: span 2;
        margin-top: 1.5rem;
        padding: 1rem;
        background: linear-gradient(135deg, var(--primary), #818CF8);
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 1.1rem;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 14px 0 rgba(79, 70, 229, 0.39);
    }

    .submit-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(79, 70, 229, 0.4);
        background: linear-gradient(135deg, var(--primary-hover), #6366F1);
    }

    @media (max-width: 768px) {
        form {
            grid-template-columns: 1fr;
        }
        .submit-btn {
            grid-column: span 1;
        }
        .dashboard-container {
            padding: 2rem;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="header">
    <h1>Health Diagnostics Dashboard</h1>
    <p>Predictive Assessment for Chronic Kidney Disease</p>
</div>

<div class="dashboard-container">
    <!-- Notice the form action route updated to 'main.predict' -->
    <form action="{{ url_for('main.predict') }}" method="POST">
        
        <div class="form-group">
            <label for="sg">Specific Gravity</label>
            <select id="sg" name="sg" required>
                <option value="" disabled selected>Select specific gravity</option>
                <option value="1.005">1.005</option>
                <option value="1.010">1.010</option>
                <option value="1.015">1.015</option>
                <option value="1.020">1.020</option>
                <option value="1.025">1.025</option>
            </select>
        </div>

        <div class="form-group">
            <label for="al">Albumin</label>
            <select id="al" name="al" required>
                <option value="" disabled selected>Select albumin level</option>
                <option value="0">0</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
            </select>
        </div>

        <div class="form-group">
            <label for="htn">Hypertension</label>
            <select id="htn" name="htn" required>
                <option value="" disabled selected>Patient has hypertension?</option>
                <option value="1">Yes (1)</option>
                <option value="0">No (0)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="dm">Diabetes Mellitus</label>
            <select id="dm" name="dm" required>
                <option value="" disabled selected>Patient has diabetes?</option>
                <option value="1">Yes (1)</option>
                <option value="0">No (0)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="hemo">Hemoglobin (gms)</label>
            <input type="number" step="any" id="hemo" name="hemo" placeholder="Enter hemoglobin in gms" required>
            <span class="helper-text">Normal range: 12 - 17 gms</span>
        </div>

        <div class="form-group">
            <label for="rbc">Red Blood Cell</label>
            <select id="rbc" name="rbc" required>
                <option value="" disabled selected>Red blood cell evaluation</option>
                <option value="0">Normal (0)</option>
                <option value="1">Abnormal (1)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="appet">Appetite</label>
            <select id="appet" name="appet" required>
                <option value="" disabled selected>Assess patient's appetite</option>
                <option value="1">Good (1)</option>
                <option value="0">Poor (0)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="pc">Pus Cells</label>
            <select id="pc" name="pc" required>
                <option value="" disabled selected>Pus cell evaluation</option>
                <option value="0">Normal (0)</option>
                <option value="1">Abnormal (1)</option>
            </select>
        </div>

        <button type="submit" class="submit-btn">Evaluate Health Status</button>
    </form>
</div>
{% endblock %}
